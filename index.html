<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Country</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,300,regular,500,600,700,800,900,200italic,300italic,italic,500italic,600italic,700italic,800italic,900italic" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="header-container">
        <div class="container">
                <h2 class="title">Where in the world?</h2>
        <p><i class="fa-regular fa-moon"></i>&nbsp;&nbsp;Dark Mode</p>
    </header>

    <main>
        <div class="search-filter-container">
           
            <div class="search-container">
                 <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Search for a country...">
            </div>
        </div>
        <div class="countries-container">
            <a href=""><div class="country-card">
                <img src="https://flagcdn.com/gn.svg" alt="flag">
                 <div class="country-card-text-item">
                    <h3>Iceland</h3>
               
                 <p><strong>Population:</strong>3,000,000</p>
                    <p><strong>Region:</strong>Europe</p>
                    <p><strong>Capital:</strong>Berlin</p>
                 </div>
                 </div>
            </a>
            
        </div>
    </main>
</body>
</html>
